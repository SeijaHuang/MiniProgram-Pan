name: Deploy Backend to Tencent Cloud

on:
  workflow_dispatch:
    inputs:
      environment:
        description: '选择部署环境'
        required: true
        default: 'trial'
        type: choice
        options:
          - trial
          - release

jobs:
  deploy:
    name: Deploy to ${{ github.event.inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SERVER_SSH_KEY }}

      - name: Add server to known hosts
        run: |
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Write .env file
        run: |
          cat > /tmp/.env << EOF
          OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
          TENCENT_SECRET_ID=${{ secrets.TENCENT_SECRET_ID }}
          TENCENT_SECRET_KEY=${{ secrets.TENCENT_SECRET_KEY }}
          EOF
          scp -P ${{ secrets.SERVER_PORT }} /tmp/.env ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/var/www/panleme/MiniProgram-Pan/backend/.env

      - name: Deploy to server
        run: |
          ssh -p ${{ secrets.SERVER_PORT }} ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} '
            set -e
            echo "=== 拉取最新代码 ==="
            cd /var/www/panleme/MiniProgram-Pan
            git pull origin master

            echo "=== 安装依赖 ==="
            cd backend
            npm ci

            echo "=== 编译 TypeScript ==="
            npm run build

            echo "=== 重启服务 ==="
            pm2 reload ecosystem.config.js --env ${{ github.event.inputs.environment }}

            echo "=== 部署完成 ==="
            pm2 status
          '