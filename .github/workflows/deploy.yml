name: Deploy Backend to Tencent Cloud

on:
  push:
    branches:
      - master
    paths:
      - 'backend/**'
      - '.github/workflows/deploy.yml'

jobs:
  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SERVER_SSH_KEY }}

      - name: Add server to known hosts
        run: |
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Write .env file
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TENCENT_SECRET_ID: ${{ secrets.TENCENT_SECRET_ID }}
          TENCENT_SECRET_KEY: ${{ secrets.TENCENT_SECRET_KEY }}
        run: |
          ssh -p ${{ secrets.SERVER_PORT }} ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} "cat > /var/www/panleme/MiniProgram-Pan/backend/.env" << EOF
          NODE_ENV=production
          PORT=8080
          LOG_LEVEL=info
          WS_PATH=/ws
          WS_HEARTBEAT_INTERVAL=30000
          WS_CLIENT_TIMEOUT=60000
          WS_MAX_RECONNECT=5
          GAME_ROOM_TIMEOUT=300000
          GAME_MOVE_TIMEOUT=30000
          OPENAI_API_KEY=${OPENAI_API_KEY}
          OPENAI_MODEL=gpt-4o
          LLM_WORKER_POLL_INTERVAL_MS=500
          LLM_WORKER_LOCK_TIMEOUT_MS=60000
          LLM_MAX_RETRIES=3
          TENCENT_SECRET_ID=${TENCENT_SECRET_ID}
          TENCENT_SECRET_KEY=${TENCENT_SECRET_KEY}
          TENCENT_REGION=ap-guangzhou
          EOF

      - name: Deploy to server
        run: |
          ssh -p ${{ secrets.SERVER_PORT }} ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} '
            set -e
            echo "=== 拉取最新代码 ==="
            cd /var/www/panleme/MiniProgram-Pan
            git pull origin master

            echo "=== 安装依赖 ==="
            cd backend
            npm ci

            echo "=== 编译 TypeScript ==="
            npm run build

            echo "=== 重启服务 ==="
            pm2 reload ecosystem.config.js --env production

            echo "=== 部署完成 ==="
            pm2 status
          '