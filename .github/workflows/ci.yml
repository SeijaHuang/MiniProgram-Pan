name: CI

on:
    pull_request:
        branches:
            - master
        types:
            - opened
            - synchronize
            - reopened

jobs:
    lint-and-type-check:
        name: Lint and Type Check
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '18'
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Install backend dependencies
              working-directory: ./backend
              run: npm ci

            - name: Run ESLint
              run: npm run lint

            - name: Run ESLint (backend)
              working-directory: ./backend
              run: npm run lint

            - name: Check code formatting
              run: npx prettier --check "**/*.{yml,yaml}" --ignore-path .prettierignore

            - name: TypeScript type check (backend)
              working-directory: ./backend
              run: npx tsc --noEmit 